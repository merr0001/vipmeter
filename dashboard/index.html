// ---- 계산 (진동지기 앱 Analyzer와 같은 방식) ----
function fft(re,im){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){[re[i],re[j]]=[re[j],re[i]];[im[i],im[j]]=[im[j],im[i]]}}
 for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);for(let i=0;i<n;i+=len){let cr=1,ci=0;for(let k=0;k<len/2;k++){const p=i+k,q=p+len/2,xr=re[q]*cr-im[q]*ci,xi=re[q]*ci+im[q]*cr;re[q]=re[p]-xr;im[q]=im[p]-xi;re[p]+=xr;im[p]+=xi;const nr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=nr}}}}
function std(a){let m=0;for(const v of a)m+=v;m/=a.length;let s=0;for(const v of a)s+=(v-m)**2;return Math.sqrt(s/a.length)}
function analyze(x,y,z,fs){const n=z.length;if(n<64)return null;const rx=std(x),ry=std(y),rz=std(z);
 let mean=0;for(const v of z)mean+=v;mean/=n;let N=1;while(N<4*n)N<<=1;if(N>32768)N=32768;const re=new Float64Array(N),im=new Float64Array(N),len=Math.min(n,N);
 for(let i=0;i<len;i++)re[i]=(z[i]-mean)*(0.5-0.5*Math.cos(2*Math.PI*i/(len-1)));fft(re,im);
 const df=fs/N,mag=new Float64Array(N/2);for(let k=1;k<N/2;k++)mag[k]=Math.hypot(re[k],im[k]);
 const k0=Math.max(1,Math.ceil(20/df)),k1=Math.min(N/2-2,Math.floor(Math.min(250,fs/2-1)/df));let kb=-1,best=-1,sum=0,cnt=0;
 for(let k=k0;k<=k1;k++){if(mag[k]>best){best=mag[k];kb=k}sum+=mag[k];cnt++}if(kb<1)return null;
 const a=mag[kb-1],b=mag[kb],c=mag[kb+1],den=a-2*b+c;let p=den?0.5*(a-c)/den:0;p=Math.max(-.5,Math.min(.5,p));const f=(kb+p)*df;
 const band=f0=>{let s=0;for(let k=Math.max(1,Math.ceil((f0-3)/df));k<=Math.min(mag.length-1,Math.floor((f0+3)/df));k++)s+=mag[k]*mag[k];return Math.sqrt(s)};
 const h1=band(f),h2=band(2*f);
 return{f,rz,v:159.155*rz/f,px:100*rx/rz,py:100*ry/rz,prom:cnt?best/(sum/cnt):0,h2:h1?100*h2/h1:0}}

// ---- 원본 수신 버퍼 (캡슐마다) ----
const RB={};
function rbuf(id){return RB[id]||(RB[id]={cap:800*70,n:0,h:0,t:new Float64Array(800*70),x:new Float32Array(800*70),y:new Float32Array(800*70),z:new Float32Array(800*70),

function axesReset(b){b.zA=-1;b.g=[0,0,0];b.gc=0;b.last=-1;b.anI=-1;b.n=0;b.h=0}
function onRaw(id,dv){const b=rbuf(id),type=dv.getUint8(0);
 if(type==0xB1&&dv.byteLength>=25){b.gyro=[dv.getFloat32(1,true),dv.getFloat32(5,true),dv.getFloat32(9,true)];b.gyroAt=Date.now();return}
 if(type!=0xA1||dv.byteLength<10)return;const n=dv.getUint8(1),idx=dv.getUint32(2,true),f=dv.getFloat32(6,true);if(dv.byteLength<10+n*6)return;
 if(f>100&&f<4000)b.fs=f;const rate=isNaN(b.fs)?800:b.fs;b.pk++;
 if(b.last>=0&&idx<b.last)axesReset(b);if(b.last>=0&&idx>b.last)b.lost+=Math.round((idx-b.last)/n);b.last=idx+n;
 if(b.anI<0){b.anI=idx;b.anT=0;b.anF=rate}else if(rate!=b.anF){b.anT+=(idx-b.anI)/b.anF;b.anI=idx;b.anF=rate}
 const G=9.80665/4096;let o=10;
 for(let i=0;i<n;i++){const r=[dv.getInt16(o,true)*G,dv.getInt16(o+2,true)*G,dv.getInt16(o+4,true)*G];o+=6;
  if(b.zA<0){for(let k=0;k<3;k++)b.g[k]+=r[k];if(++b.gc>=400){let k=0;for(let j=1;j<3;j++)if(Math.abs(b.g[j])>Math.abs(b.g[k]))k=j;b.zA=k;b.xA=k==0?1:0;b.yA=k==2?1:2}}
  const zi=b.zA<0?2:b.zA,xi=b.zA<0?0:b.xA,yi=b.zA<0?1:b.yA;
  b.t[b.h]=b.anT+(idx+i-b.anI)/b.anF;b.x[b.h]=r[xi];b.y[b.h]=r[yi];b.z[b.h]=r[zi];b.h=(b.h+1)%b.cap;if(b.n<b.cap)b.n++}}
// 측정 주기마다 최근 '측정 시간' 구간을 계산 → 기록
function measureTick(){const now=Date.now();for(const id in RB){const b=RB[id];if(now<b.next||b.n<200)continue;b.next=now+S.cfg.period*1000;
 const fs=isNaN(b.fs)?800:b.fs,want=Math.min(b.n,Math.round(S.cfg.meas*fs));if(want<fs*0.8)continue;
 const x=new Float32Array(want),y=new Float32Array(want),z=new Float32Array(want);const s0=(b.h-want+b.cap)%b.cap;
 for(let i=0;i<want;i++){const k=(s0+i)%b.cap;x[i]=b.x[k];y[i]=b.y[k];z[i]=b.z[k]}
 const r=analyze(x,y,z,fs);const c=S.caps[id]||{};
 if(!r||r.prom<4||r.rz<0.3){if(DUTY[id])DUTY[id].done=true;onData({id,rms:+(r?r.v:0).toFixed(1)*(r&&r.rz>=0.3?1:0),hz:0,bat:c.bat,ms:want/fs*1000});continue}

 const seg=Math.round(fs),vs=[];for(let s=0;s+seg<=want;s+=seg)vs.push(159.155*std(z.subarray(s,s+seg))/r.f);
 const mu=vs.reduce((a,v)=>a+v,0)/vs.length,cv=vs.length>1?Math.sqrt(vs.reduce((a,v)=>a+(v-mu)**2,0)/vs.length)/mu*100:0;

 let rk=null;if(b.gyro&&now-b.gyroAt<3000){const zi=b.zA<0?2:b.zA,xi=b.zA<0?0:b.xA,yi=b.zA<0?1:b.yA,w=2*Math.PI*r.f;

 ${kpi("배터리 소모",drain?drain.toFixed(1)+" %/시간":"—",drain?`100% → 0% 약 <b>${(100/drain).toFixed(1)}시간</b>`:"데이터가 더 쌓이면 계산",drain?(100/drain>=12?"ok":100/drain>=9?"warn":"bad"):"")}
 </div>
 <div class="g2c">${chartBox("진동 속도 RMS (mm/s)",rows,"rms","#2f6fe4")}${chartBox("주파수 (Hz)",rows,"hz","#7a5af5")}${chartBox("옆 흔들림 X · Y (%)",rows,"x","#d93b33","y","#d4900f",20)}${chartBox("2배 진동 (%)",rows,"h2","#1f9d63",null,null,10)}${chartBox("배터리 (%)",rows,"bat","#14824f")}
 <div class="box2"><h3>평균값 요약</h3><table class="hist"><tr><th></th><th>평균</th><th>표준편차</th><th>최소</th><th>최대</th></tr>${[["RMS mm/s",R],["주파수 Hz",H],["X/Z %",X],["Y/Z %",Y],["2배 진동 %",H2]].map(([l,o])=>`<tr><td>${l}</td><td><b>${f(o,"mu")}</b></td><td>${f(o,"sd")}</td><td>${f(o,"min")}</td><td>${f(o,"max")}</td></tr>`).join("")}</table></div></div>
 <div class="box2" style="margin-top:14px"><h3>측정 기록 <span class="cap">(최근 300건)</span></h3><div class="tscroll"><table class="hist"><tr><th>시각</th><th>호기</th><th>캡슐</th><th>LOT</th><th>RMS</th><th>Hz</th><th>X%</th><th>Y%</th><th>2배%</th><th>안정도%</th><th>배터리</th></tr>
 ${rows.slice(-300).reverse().map(r=>`<tr><td>${dt(r.t)}</td><td>${r.n||"—"}</td><td>${r.id}</td><td style="font-family:monospace">${r.lot||""}</td><td><b>${r.rms}</b></td><td>${r.hz}</td><td>${r.x??""}</td><td>${r.y??""}</td><td>${r.h2??""}</td><td>${r.cv??""}</td><td>${r.bat??""}%</td></tr>`).join("")}</table></div></div>`
 :'<div class="box2" style="color:var(--mut)">이 조건의 측정 기록이 없습니다. 캡슐 관리에서 캡슐을 연결하거나 시뮬레이션을 켜세요.</div>'}`;
 $("d_n").onchange=e=>{DF.n=e.target.value;renderData()};$("d_r").onchange=e=>{DF.range=e.target.value;renderData()};
 if($("d_f")){$("d_f").onchange=e=>{DF.from=e.target.value;renderData()};$("d_t").onchange=e=>{DF.to=e.target.value;renderData()}}
 $("d_csv").onclick=()=>dl("진동기록_"+stamp()+".csv",["시각,호기,캡슐,LOT,RMS mm/s,주파수 Hz,X/Z %,Y/Z %,2배 진동 %,안정도 %,배터리 %,측정 시간 ms"].concat(rows.map(r=>[new Date(r.t).toLocaleString("sv-SE"),r.n||"",r.id,r.lot||"",r.rms,r.hz,r.x??"",r.y??"",r.h2??"",r.cv??"",r.bat??"",r.ms??""].join(","))).join("\n"));
 $("d_rep").onclick=()=>{const t=`[진동 측정 시험 요약]\n대상: ${DF.n?DF.n+"호기":"전체"} / 기간 ${rows.length?dt(rows[0].t)+" ~ "+dt(rows[rows.length-1].t):""} (${(span/36e5).toFixed(1)}시간)\n측정: 측정 시간 ${S.cfg.meas}초, 주기 ${S.cfg.period}초, 총 ${rows.length}회 (수신 성공률 ${rate.toFixed(0)}%)\n진동 속도 RMS: 평균 ${f(R,"mu")} mm/s ± ${f(R,"sd")} (변동 ${f(R,"cv")}%)\n주파수: 평균 ${f(H,"mu",2)} Hz ± ${f(H,"sd",2)}\n옆 흔들림: X ${f(X,"mu",0)}% / Y ${f(Y,"mu",0)}%, 2배 진동 ${f(H2,"mu")}%\n배터리: ${drain?drain.toFixed(1)+"%/시간 → 완충 시 약 "+(100/drain).toFixed(1)+"시간 사용":"계산 불가"}`;
  navigator.clipboard.writeText(t).then(()=>alertBox("<pre style='white-space:pre-wrap;font-family:inherit'>"+t+"</pre><div class='cap'>클립보드에 복사됐습니다. 메일·보고서에 붙여넣으세요.</div>"),()=>alertBox("<pre style='white-space:pre-wrap;font-family:inherit'>"+t+"</pre>"))};
 $("d_clr").onclick=()=>{$("mdb").innerHTML=`<div class="dh"><h2>측정 기록 지우기</h2><button class="x" onclick="closeM()">×</button></div><div>저장된 측정 기록 ${all.length}건을 모두 지웁니다. 먼저 CSV로 내려받아 두세요.</div><div class="row" style="margin-top:14px"><button class="btn red" id="d_yes">모두 지우기</button><button class="btn" onclick="closeM()">취소</button></div>`;$("md").classList.add("open");$("d_yes").onclick=()=>recClear().then(()=>{closeM();renderData()})}}
function kpi(t,v,s,c){return `<div class="kp ${c||""}"><div class="mt">${t}</div><div class="kv2">${v}</div><div class="cap">${s}</div></div>`}
function chartBox(title,rows,k,col,k2,col2,lim){const pts=rows.filter(r=>r[k]!=null);if(pts.length<2)return `<div class="box2"><h3>${title}</h3><div class="cap">데이터 부족</div></div>`;
 const W=560,H=170,t0=pts[0].t,t1=pts[pts.length-1].t||t0+1,vals=pts.map(r=>r[k]).concat(k2?pts.map(r=>r[k2]??0):[]).concat(lim?[lim]:[]),lo=Math.min(...vals),hi=Math.max(...vals),pad=(hi-lo)*.12||1,a=lo-pad,b=hi+pad;
 const X=t=>36+(t-t0)/((t1-t0)||1)*(W-46),Y=v=>H-22-(v-a)/(b-a)*(H-34),line=(kk,c)=>`<polyline fill="none" stroke="${c}" stroke-width="1.8" points="${pts.filter(r=>r[kk]!=null).map(r=>X(r.t).toFixed(1)+","+Y(r[kk]).toFixed(1)).join(" ")}"/>`;
 const ticks=[a+pad,(a+b)/2,b-pad];
 return `<div class="box2"><h3>${title}${k2?` <span class="cap"><b style="color:${col}">━ X</b> <b style="color:${col2}">━ Y</b></span>`:""}</h3><svg viewBox="0 0 ${W} ${H}" width="100%">
 ${ticks.map(v=>`<line x1="36" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" stroke="#eef1f5"/><text x="2" y="${Y(v)+4}" font-size="11" fill="#9aa4ae">${v.toFixed(v<10?1:0)}</text>`).join("")}
 ${lim?`<line x1="36" x2="${W-10}" y1="${Y(lim)}" y2="${Y(lim)}" stroke="#d93b33" stroke-dasharray="5 4"/>`:""}${line(k,col)}${k2?line(k2,col2):""}
 <text x="36" y="${H-4}" font-size="11" fill="#9aa4ae">${dt(t0)}</text><text x="${W-10}" y="${H-4}" font-size="11" fill="#9aa4ae" text-anchor="end">${dt(t1)}</text></svg></div>`}
let RT=null;function soon(){if(RT||DRAG||DRAGLOT)return;RT=setTimeout(()=>{RT=null;if(PG=="board")render();else if(PG=="caps")renderCaps()},400)}
let UIT=null;function setUiTimer(){clearInterval(UIT);UIT=setInterval(()=>{if(DRAG||DRAGLOT)return;if(PG=="board")render();else if(PG=="caps"&&!document.activeElement.matches("input,select"))renderCaps()},S.cfg.ui*1000)}

const tick=()=>{const d=new Date();$("clk").textContent=d.toLocaleDateString("ko-KR")+" "+d.toLocaleTimeString("ko-KR",{hour12:false})};tick();setInterval(tick,1000);

// ===== 알림 (윈도우 팝업 + 경고음) =====
let ALPREV=new Set(),BEEPING=false,ACK=false,BEEPT=null,ACTX=null;
function beep(){try{ACTX=ACTX||new AudioContext();[0,0.25].forEach(d=>{const o=ACTX.createOscillator(),g=ACTX.createGain();o.frequency.value=1500;g.gain.value=0.25;o.connect(g);g.connect(ACTX.destination);o.start(ACTX.currentTime+d);o.stop(ACTX.currentTime+d+0.15)})}catch(e){}}
function alertWatch(al){if(REMOTE)return;const now=new Set(al);const red=al.filter(a=>a.startsWith("🔴"));
 for(const a of al)if(!ALPREV.has(a)&&(a.startsWith("🔴")||a.includes("센서 신호 끊김")||a.includes("배터리"))){if(APP)hg.notify("H.G 진동기 상황판",a.replace(/^\S+ /,""));if(a.startsWith("🔴"))ACK=false}
 ALPREV=now;const want=red.length>0&&!ACK&&APPCFG.beep!==false;
 if(want&&!BEEPING){BEEPING=true;beep();BEEPT=setInterval(beep,(APPCFG.beepRepeat||30)*1000)}
 if(!want&&BEEPING){BEEPING=false;clearInterval(BEEPT)}
 const b=$("ackb");if(b)b.style.display=red.length&&!ACK?"":"none"}
function ackAlarm(){ACK=true;if(BEEPING){BEEPING=false;clearInterval(BEEPT)}const b=$("ackb");if(b)b.style.display="none"}

// ===== 프로그램 설정 (윈도우 프로그램에서만) =====
async function renderSettings(){const c=$("pg-settings");if(!APP){c.innerHTML='<div class="box2">윈도우 프로그램에서만 쓰는 페이지입니다.</div>';return}
 const cf=await hg.getConfig(),inf=await hg.info();APPCFG=cf;
 const sw=(k,t,d)=>`<div class="srow"><div><b>${t}</b><span>${d}</span></div><label class="sw"><input type="checkbox" data-k="${k}" ${cf[k]?"checked":""}><i></i></label></div>`;
 const nm=(k,t,d,u)=>`<div class="srow"><div><b>${t}</b><span>${d}</span></div><div><input type="number" data-n="${k}" value="${cf[k]}" style="width:90px;text-align:center;font-weight:800"> ${u}</div></div>`;
 const urls=inf.addrs.map(a=>`http://${a.ip}:${inf.port||cf.port}`);
 c.innerHTML=`<div class="g2s">
 <div class="box2"><h3>실행</h3>${sw("autoStart","윈도우 시작 시 자동 실행","PC를 켜면 상황판이 저절로 열립니다")}${sw("fullscreen","전체 화면","F11로도 켜고 끔 · Esc로 해제")}${sw("trayOnClose","창을 닫으면 작업표시줄 아이콘으로 숨기기","닫아도 측정·저장은 계속됩니다 · 끄려면 아이콘 우클릭 → 프로그램 끄기")}${sw("preventSleep","절전 모드 막기","프로그램이 켜져 있는 동안 화면이 꺼지지 않게 합니다")}</div>
 <div class="box2"><h3>캡슐 연결</h3>${sw("autoConnect","켜면 자동 연결","프로그램을 켜면 버튼 없이 캡슐(HG-CAP-…)에 연결")}${nm("lostSec","끊김 경고까지","이 시간 동안 받은 값이 없으면 경고","초")}
  <div class="srow"><div><b>다른 캡슐로 바꾸기</b><span>기억한 캡슐을 지우고 다음 연결 때 새로 찾습니다</span></div><button class="btn" id="st_forget">캡슐 다시 찾기</button></div></div>
 <div class="box2"><h3>원격 보기 (같은 Wi-Fi의 PC·폰·TV)</h3>${sw("remote","원격 보기 켜기","다른 기기 브라우저에서 상황판 화면만 봅니다 (보기 전용)")}${nm("port","포트","보통 8000","")}
  <div class="srow"><div><b>접속 주소</b><span>다른 기기 크롬 주소창에 입력 · 지금 보는 기기 ${inf.viewers}대</span></div><div class="urls">${inf.remote?urls.map(u=>`<code>${u}</code>`).join("")||"<span>Wi-Fi 연결 없음</span>":"<span>꺼짐</span>"}</div></div>
  <div class="cap">안 열리면: 다른 기기에서 <b>ping ${inf.addrs[0]?inf.addrs[0].ip:"(이 PC 주소)"}</b> 확인 · 처음 켤 때 윈도우 방화벽 창이 뜨면 <b>"허용"</b>을 누르세요.</div></div>
 <div class="box2"><h3>알림</h3>${sw("notify","윈도우 알림","RMS 이상·센서 끊김·배터리 부족 때 오른쪽 아래 팝업")}${sw("beep","경고음","🔴 이상이면 [🔕 확인]을 누를 때까지 소리")}${nm("beepRepeat","경고음 반복 간격","","초")}${nm("batWarn","배터리 경고 기준","","%")}</div>
 <div class="box2"><h3>저장</h3><div class="srow"><div><b>기록 폴더</b><span><code>${inf.folder}</code><br>측정값은 날짜별 CSV(엑셀)로, 하루 한 번 전체 백업(백업 폴더)으로 저장됩니다</span></div><button class="btn" id="st_folder">폴더 열기</button></div>
  <div class="srow"><div><b>백업</b><span>LOT·정반·호기·설정 전체</span></div><div><button class="btn" id="st_bak">⬇ 내보내기</button> <label class="btn">⬆ 불러오기<input type="file" id="st_res" accept=".json" style="display:none"></label></div></div></div>
 <div class="box2"><h3>데이터 초기화</h3><div class="srow"><div><b>예시 데이터로 채우기</b><span>화면 연습용 (지금 내용은 지워짐)</span></div><button class="btn" id="st_demo">예시 채우기</button></div>
  <div class="srow"><div><b>모두 비우기</b><span>LOT·이력을 지우고 1~17호기 빈 상태로 (측정 기록 CSV는 남음)</span></div><button class="btn red" id="st_clear">모두 비우기</button></div></div>
 </div><div class="cap" style="margin-top:10px">프로그램 v${inf.version}</div>`;
 c.querySelectorAll("[data-k]").forEach(i=>i.onchange=async()=>{APPCFG=await hg.setConfig({[i.dataset.k]:i.checked});renderSettings()});
 c.querySelectorAll("[data-n]").forEach(i=>i.onchange=async()=>{APPCFG=await hg.setConfig({[i.dataset.n]:+i.value});renderSettings()});
 $("st_forget").onclick=()=>{hg.bleForget();bleOff();setTimeout(bleConnect,800)};$("st_folder").onclick=()=>hg.openFolder();

 $("st_res").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{try{const v=JSON.parse(t);if(v.mach){S=v;save();location.reload()}}catch(er){alertBox("백업 파일을 읽을 수 없습니다")}})};
 const ask=(t,fn)=>{$("mdb").innerHTML=`<div class="dh"><h2>${t}</h2><button class="x" onclick="closeM()">×</button></div><div class="row" style="margin-top:6px"><button class="btn red" id="yes">확인</button><button class="btn" onclick="closeM()">취소</button></div>`;$("md").classList.add("open");$("yes").onclick=()=>{closeM();fn()}};
 $("st_demo").onclick=()=>ask("예시 데이터로 채울까요? 지금 LOT·이력이 지워집니다",()=>{const caps=S.caps,cfg=S.cfg;S=demo();S.caps=caps;S.cfg=cfg;save();location.hash="#/board";route()});
 $("st_clear").onclick=()=>ask("모두 비울까요? LOT·이력이 지워집니다",()=>{const caps=S.caps,cfg=S.cfg;S=emptyState();S.caps=caps;S.cfg=cfg;save();location.hash="#/board";route()})}

document.body.classList.toggle("remote",REMOTE);document.body.classList.toggle("app",APP);
if(!APP)$("navset").style.display="none";
if(APP)hg.getConfig().then(c=>{APPCFG=c;window.APPCFG_BAT=c.batWarn});
if(REMOTE){const es=new EventSource("/events");es.onmessage=e=>{try{const v=JSON.parse(e.data);if(v&&v.mach){S=v;if(PG=="board")render();else if(PG=="machine")renderMachine()}}catch(er){}};
 $("lk").removeAttribute("href");setInterval(()=>{LINK=Object.values(S.caps||{}).some(c=>c.last&&Date.now()-c.last<lostMs())?"on":"off";linkBadge()},3000)}
setUiTimer();
route();
