plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hg.vibmeter'
    compileSdk 34

    defaultConfig {
        applicationId 'com.hg.vibmeter'
        minSdk 29
        targetSdk 34
        versionCode 19
        versionName '2.9'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
